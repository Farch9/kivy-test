name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          autoconf automake libtool pkg-config \
          zlib1g-dev libncurses-dev cmake \
          libffi-dev libssl-dev build-essential \
          libtinfo6 ccache

    - name: Set up Android SDK
      run: |
        mkdir -p $HOME/.buildozer/android/platform/android-sdk
        cd $HOME/.buildozer/android/platform/android-sdk

        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        rm commandlinetools-linux-9477386_latest.zip

        # После распаковки появилась папка cmdline-tools/ с подпапками bin, lib и т.д.
        # Buildozer ищет sdkmanager в tools/bin
        # Создаём правильную структуру
        mkdir -p tools/bin
        ln -sf $PWD/cmdline-tools/bin/sdkmanager tools/bin/sdkmanager
        ln -sf $PWD/cmdline-tools/bin/avdmanager tools/bin/avdmanager

        # Также для cmdline-tools нужна структура для самого sdkmanager
        mkdir -p cmdline-tools/latest
        # Если cmdline-tools/lib и cmdline-tools/bin существуют — переместим в latest/
        if [ -d "cmdline-tools/bin" ]; then
          mv cmdline-tools/bin cmdline-tools/latest/
          mv cmdline-tools/lib cmdline-tools/latest/ 2>/dev/null || true
          [ -f cmdline-tools/NOTICE.txt ] && mv cmdline-tools/NOTICE.txt cmdline-tools/latest/
          [ -f cmdline-tools/source.properties ] && mv cmdline-tools/source.properties cmdline-tools/latest/
        fi

        # Обновляем симлинки на новый путь
        ln -sf $PWD/cmdline-tools/latest/bin/sdkmanager tools/bin/sdkmanager
        ln -sf $PWD/cmdline-tools/latest/bin/avdmanager tools/bin/avdmanager

        # Принимаем все лицензии
        yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$PWD --licenses 2>/dev/null || true

        # Устанавливаем нужные компоненты
        cmdline-tools/latest/bin/sdkmanager --sdk_root=$PWD \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2"

        # Проверка
        ls -la tools/bin/
        ls -la build-tools/

    - name: Install buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Build APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        buildozer android debug

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kozel-apk
        path: bin/*.apk
        retention-days: 30
